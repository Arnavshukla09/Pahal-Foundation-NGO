<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'content/css/base-styles.css' %}">
    <link rel="stylesheet" href="{% static 'content/css/video_playing.css' %}">
    <link rel="stylesheet" href="{% static 'pahal/css/responsive-styles.css' %}">
    <link rel="icon" type="image/icon" href="{% static 'pahal/icon/favicon.ico' %}">
    <title>{% block title %}{% endblock title %}</title>
</head>
<body>
{{request.first_name}}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <nav class="nav-bar" style="display: flex; align-items: center; padding: 15px 30px; background: #e83e50; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <a href="javascript:history.back()" style="color: white; text-decoration: none; font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </nav>
        {% block body %}{% endblock body %}
    <script src="{% static 'content/js/main.js' %}"></script>
</body>
</html>
